
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오답문제 해결하여 수능 만점 받기(지구과학Ⅰ편)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0F1720;
    --surface:#172231;
    --surface-2:#1F2E40;
    --text:#E8EDF2;
    --text-dim:#8FA3B8;
    --accent:#5EEAD4;
    --accent-dim:#1E3A38;
    --danger:#F87171;
    --danger-dim:#3A2020;
    --line:#28374A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  a.back{
    align-self:flex-start;
    margin:20px 0 0 24px;
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
  }
  a.back:hover{color:var(--accent);}
  header{
    width:100%;
    max-width:640px;
    padding:20px 24px 8px;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  h1{
    font-size:clamp(20px, 3.6vw, 27px);
    font-weight:700;
    margin:0 0 8px;
  }
  p.sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0 0 18px;
  }
  svg.wave{ display:block; margin:0 auto 20px; }
  svg.wave path{
    fill:none;
    stroke:var(--accent);
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:6 5;
    animation:flow 1.4s linear infinite;
  }
  @keyframes flow{ to{ stroke-dashoffset:-22; } }

  .steps{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:26px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .steps .dot{
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .steps .dot.on{ border-color:var(--accent); color:var(--accent); }
  .steps .dot.done{ background:var(--accent); color:#08201d; border-color:var(--accent); }

  main{
    width:100%;
    max-width:640px;
    padding:0 24px 80px;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
  }
  .panel + .panel{ margin-top:16px; }
  label.field-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:15px;
    margin-bottom:14px;
  }
  label.field-label .num{
    width:22px; height:22px;
    border-radius:50%;
    background:var(--accent);
    color:#08201d;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  input[type=text]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
  }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }
  input[type=text]::placeholder{ color:var(--text-dim); }
  .hint{ font-size:12px; color:var(--text-dim); margin-top:8px; }

  button.primary{
    width:100%;
    margin-top:18px;
    background:var(--accent);
    color:#08201d;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  button.primary:disabled{ opacity:.4; cursor:not-allowed; }
  button.ghost{
    width:100%;
    margin-top:10px;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
  }
  button.ghost:hover{ color:var(--text); border-color:var(--text-dim); }

  .exam-list .exam-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 16px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:14px;
  }
  .exam-item:hover{ border-color:var(--accent); }
  .exam-item.selected{ border-color:var(--accent); background:var(--accent-dim); }
  .exam-item .status{ font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono', monospace; }
  .exam-item .links{ display:flex; gap:6px; }
  .exam-item .links a{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.02em;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:5px;
    padding:3px 7px;
    text-decoration:none;
    white-space:nowrap;
  }
  .exam-item .links a:hover{ color:var(--accent); border-color:var(--accent); }

  .qgrid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px;
    margin-bottom:8px;
  }
  .qcell{
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    cursor:pointer;
  }
  .qcell:hover{ border-color:var(--danger); }
  .qcell.wrong{ background:var(--danger-dim); border-color:var(--danger); color:var(--danger); font-weight:700; }


  .rec-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .rec-header .count{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--accent);
  }
  .count-select{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .count-select .opts{
    display:flex;
    gap:6px;
  }
  .count-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:8px;
    padding:6px 12px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .count-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .count-btn.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

  .wrong-reason-list{
    margin:16px 0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .wrong-reason-row{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .wrong-reason-row .qlabel{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--danger);
    margin-bottom:8px;
  }
  .reason-opts{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .reason-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    line-height:1.4;
  }
  .reason-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .reason-btn.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .wrong-badge{
    display:flex; align-items:center; gap:10px;
    background:var(--danger-dim);
    border:1px solid var(--danger);
    border-radius:10px;
    padding:12px 14px;
    margin:14px 0;
    font-size:13px;
  }
  .wrong-badge b{ color:var(--danger); }
  .rec-item{
    display:block;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    text-decoration:none;
    color:var(--text);
  }
  .rec-item:hover{ border-color:var(--accent); }
  .rec-item .title{ font-size:14px; font-weight:600; margin-bottom:3px; }
  .rec-item .meta{ font-size:12px; color:var(--text-dim); }
  .empty-note{
    font-size:13px;
    color:var(--text-dim);
    background:var(--surface-2);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    line-height:1.6;
  }
  .sample-flag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:1px 6px;
    margin-left:6px;
  }

  .rec-block{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .rec-block .title{ font-size:14px; font-weight:600; margin-bottom:2px; }
  .rec-block .meta{ font-size:12px; color:var(--text-dim); margin-bottom:12px; }
  .pdf-frame-wrap{
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:#0b1119;
  }
  .pdf-frame-wrap iframe{
    width:100%;
    height:360px;
    border:none;
    display:block;
  }
  .pdf-missing{
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    padding:0 20px;
    line-height:1.6;
  }
  .q-image-wrap{
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:#fff;
  }
  .q-image-wrap img{
    width:100%;
    display:block;
  }
  .answer-link{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
    text-decoration:none;
    border-bottom:1px dotted var(--text-dim);
  }
  .answer-link:hover{ color:var(--accent); border-color:var(--accent); }
  .answer-toggle{
    margin-top:10px;
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
    border-radius:8px;
    padding:9px 14px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .answer-toggle:hover{ background:var(--accent-dim); }
  .answer-box{
    margin-top:10px;
    display:none;
  }
  .answer-box.open{ display:block; }
  .answer-box .plain{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--accent);
    background:var(--accent-dim);
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:8px;
  }
</style>
</head>
<body>
  <a class="back" href="index.html">← 과목 선택으로</a>

  <header>
    <div class="eyebrow">Subject 02 · Earth Science Ⅰ</div>
    <h1>오답문제 해결하여 수능 만점 받기(지구과학Ⅰ편)</h1>
    <p class="sub" id="subLine">틀린 문제를 체크하면 같은 단원의 유사 문제를 추천해 드려요.</p>
    <svg class="wave" width="180" height="30" viewBox="0 0 180 30">
      <path d="M0,15 L30,15 L38,3 L48,27 L58,15 L180,15" />
    </svg>
    <div class="steps">
      <span class="dot" data-step="1">1</span>
      <span class="dot" data-step="2">2</span>
      <span class="dot" data-step="3">3</span>
    </div>
  </header>

  <main>
<!-- STEP 1 -->
    <section class="panel step" id="step1" style="display:none">
      <label class="field-label"><span class="num">1</span> 본인이 응시한 시험을 선택하세요</label>
      <div class="exam-list" id="examList"></div>
    </section>

    <!-- STEP 2 -->
    <section class="panel step" id="step2" style="display:none">
      <label class="field-label"><span class="num">2</span> 틀린 문항을 선택하세요</label>
      <div class="qgrid" id="qgrid"></div>
      <div class="hint">문항 번호를 누르면 오답으로 표시됩니다 (지구과학Ⅰ은 1~20번). 단원은 자동으로 인식됩니다.</div>
      <div id="wrongReasonList" class="wrong-reason-list"></div>

      <button class="primary" id="toStep4" disabled>추천 문제 받기</button>
      <button class="ghost" id="backTo2">← 시험 다시 선택</button>
    </section>

    <!-- STEP 3 -->
    <section class="panel step" id="step3" style="display:none">
      <div class="rec-header">
        <label class="field-label" style="margin-bottom:0;"><span class="num">3</span> 추천 문제</label>
      </div>
      <div class="count-select">
        <span>추천 문항 수</span>
        <div class="opts" id="countOpts">
          <button type="button" class="count-btn active" data-count="10">10개</button>
          <button type="button" class="count-btn" data-count="20">20개</button>
          <button type="button" class="count-btn" data-count="30">30개</button>
        </div>
      </div>
      <div id="recResults"></div>
      <button class="ghost" id="backTo3">← 다른 문제 체크하기</button>
      <button class="ghost" id="restart">← 시험 다시 선택</button>
    </section>

  </main>

<script>
/* ======================================================================
   편집 가이드
   1) EARTH_EXAMS    : 응시 가능한 시험 목록 + EBSi/평가원 링크(시험 선택 화면용)
   2) QUESTION_MAP   : "문항_매핑표_템플릿.xlsx"를 채운 뒤 그 내용을 그대로
                        옮겨 적는 곳입니다. 여기 있는 데이터가 곧 "단원 자동 인식"과
                        "PDF 바로 보기"의 근거가 됩니다.
                        - key 형식: "시험id__문항번호"  (예: "2025su__11")
                        - problemPdf / answerPdf 는 pdfs/problems, pdfs/answers
                          폴더에 넣은 실제 PDF 파일명과 정확히 같아야 합니다.
                        - PDF가 아직 없으면 파일명을 빈 문자열("")로 두세요.
                          자동으로 "PDF 준비중" 안내가 표시됩니다.
   ====================================================================== */

let state = {
  exam: null,
  wrongQuestions: [],   // [qnum, qnum, ...]
  wrongReasons: {},     // { qnum: "concept" | "data" | "logic" }
};

const REASON_LABELS = {
  concept: "개념 누수",
  data: "자료 해석 오류",
  logic: "추론·계산 실수",
};

const $ = (sel) => document.querySelector(sel);
const stepsEl = document.querySelectorAll(".steps .dot");

function goStep(n){
  document.querySelectorAll(".step").forEach(s => s.style.display = "none");
  $("#step" + n).style.display = "block";
  stepsEl.forEach(d => {
    const s = Number(d.dataset.step);
    d.classList.toggle("on", s === n);
    d.classList.toggle("done", s < n);
  });
}

// STEP 1
function renderExamList(){
  const wrap = $("#examList");
  wrap.innerHTML = "";
  EARTH_EXAMS.forEach(exam => {
    const div = document.createElement("div");
    div.className = "exam-item";
    div.innerHTML = `
      <span>${exam.label}</span>
      <span class="links">
        <a href="${exam.ebsiUrl}" target="_blank" rel="noopener">EBSi ↗</a>
        <a href="${exam.kiceUrl}" target="_blank" rel="noopener">평가원 ↗</a>
      </span>
    `;
    div.querySelectorAll(".links a").forEach(a => a.addEventListener("click", (e) => e.stopPropagation()));
    div.addEventListener("click", () => {
      state.exam = exam;
      document.querySelectorAll(".exam-item").forEach(el => el.classList.remove("selected"));
      div.classList.add("selected");
      state.wrongQuestions = [];
      state.wrongReasons = {};
      renderGrid();
      goStep(2);
    });
    wrap.appendChild(div);
  });
}
renderExamList();

// STEP 2
function renderGrid(){
  const grid = $("#qgrid");
  grid.innerHTML = "";
  for(let i = 1; i <= 20; i++){
    const cell = document.createElement("div");
    cell.className = "qcell";
    cell.textContent = i;
    cell.addEventListener("click", () => toggleWrong(i, cell));
    grid.appendChild(cell);
  }
  $("#wrongReasonList").innerHTML = "";
  $("#toStep4").disabled = true;
}

function toggleWrong(qnum, cell){
  const idx = state.wrongQuestions.indexOf(qnum);
  if(idx >= 0){
    state.wrongQuestions.splice(idx, 1);
    delete state.wrongReasons[qnum];
    cell.classList.remove("wrong");
  } else {
    state.wrongQuestions.push(qnum);
    state.wrongReasons[qnum] = "concept"; // 기본값: 개념 누수
    cell.classList.add("wrong");
  }
  state.wrongQuestions.sort((a,b) => a-b);
  $("#toStep4").disabled = state.wrongQuestions.length === 0;
  renderWrongReasonList();
}

// 오답 원인 선택 UI — 문항마다 개념 누수 / 자료 해석 오류 / 추론·계산 실수 중 하나를 고름
function renderWrongReasonList(){
  const wrap = $("#wrongReasonList");
  wrap.innerHTML = "";
  state.wrongQuestions.forEach(qnum => {
    const row = document.createElement("div");
    row.className = "wrong-reason-row";
    const currentReason = state.wrongReasons[qnum] || "concept";
    row.innerHTML = `
      <div class="qlabel">${qnum}번 오답 원인</div>
      <div class="reason-opts">
        ${Object.entries(REASON_LABELS).map(([key, label]) => `
          <button type="button" class="reason-btn ${key === currentReason ? 'active' : ''}" data-qnum="${qnum}" data-reason="${key}">${label}</button>
        `).join("")}
      </div>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll(".reason-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const qnum = Number(btn.dataset.qnum);
      state.wrongReasons[qnum] = btn.dataset.reason;
      wrap.querySelectorAll(`.reason-btn[data-qnum="${qnum}"]`).forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
}

$("#toStep4").addEventListener("click", () => {
  renderRecommendations();
  goStep(3);
});
$("#backTo2").addEventListener("click", () => goStep(1));

// STEP 3
const CROPS_BASE = "pdfs/earth/"; // 문항별로 잘라낸 이미지 (파일명 = QUESTION_MAP의 key + .jpg)
let MAX_RECOMMEND = 10; // 단원당 최대 추천 문항 수 (기본 10, 버튼으로 20/30 선택 가능)

document.querySelectorAll("#countOpts .count-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#countOpts .count-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    MAX_RECOMMEND = parseInt(btn.dataset.count, 10);
    if(state.exam && state.wrongQuestions.length){
      renderRecommendations();
    }
  });
});

// 문제 이미지 블록. 잘라낸 이미지가 없으면 원본 PDF(#page=N)로 자동 대체합니다.
function questionImageBlock(mkey, m){
  const imgSrc = `${CROPS_BASE}${mkey}.jpg`;
  const fallbackSrc = m.problemPdf ? `${PDF_BASE}${m.problemPdf}#page=${m.problemPage || 1}` : "";
  if(!m.problemPdf){
    return `<div class="pdf-frame-wrap"><div class="pdf-missing">문제 PDF 준비중<br>pdfs/ 폴더에 파일을 넣고 QUESTION_MAP에 파일명을 채워주세요</div></div>`;
  }
  return `<div class="q-image-wrap" data-fallback="${fallbackSrc}">
    <img src="${imgSrc}" alt="문제 이미지" loading="lazy">
  </div>`;
}

// 정답 링크(가벼운 텍스트 링크로 대체 — 전체 PDF를 매번 불러오지 않도록 함)
function answerLink(m){
  if(!m.answerPdf) return "";
  const href = `${PDF_BASE}answers/${m.answerPdf}#page=${m.answerPage || 1}`;
  return `<a class="answer-link" href="${href}" target="_blank" rel="noopener">정답표 원본 PDF 보기 →</a>`;
}

function renderRecommendations(){
  const wrap = $("#recResults");
  wrap.innerHTML = "";

  state.wrongQuestions.forEach(qnum => {
    const key = `${state.exam.id}__${qnum}`;
    const info = QUESTION_MAP[key];
    const reason = state.wrongReasons[qnum] || "concept";
    const reasonLabel = REASON_LABELS[reason];

    if(!info){
      const badge = document.createElement("div");
      badge.className = "wrong-badge";
      badge.innerHTML = `❌ <b>${qnum}번 오답</b> · ${state.exam.label}`;
      wrap.appendChild(badge);

      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = `이 문항(${state.exam.label} ${qnum}번)은 아직 문항 매핑표에 등록되지 않았습니다. "문항_매핑표_템플릿.xlsx"에 추가해 주시면 자동으로 단원 인식·추천이 됩니다.`;
      wrap.appendChild(note);
      return;
    }

    const badge = document.createElement("div");
    badge.className = "wrong-badge";
    badge.innerHTML = `❌ <b>${qnum}번 오답</b> · ${info.unit} &gt; ${info.subunit} &gt; ${info.subsub} · ${reasonLabel} · ${state.exam.label}`;
    wrap.appendChild(badge);

    // 오답 원인에 따라 추천 기준을 다르게 적용
    //  - 개념 누수      : 소단원 → (부족하면) 중단원 → (그래도 부족하면) 대단원 순으로 확장하며 매칭
    //  - 자료 해석 오류 : 단원과 무관하게 같은 자료 유형(그래프/표/실험)의 문제 (자료 읽는 연습)
    //  - 추론·계산 실수 : 단원과 무관하게 배점 3점(복합 추론형) 문제 (다단계 추론 연습)
    const MIN_POOL = 5; // 이보다 적으면 한 단계 상위 범위로 자동 확장
    let matches, poolLabel;
    if(reason === "data"){
      matches = Object.entries(QUESTION_MAP).filter(
        ([k, v]) => k !== key && v.material === info.material
      );
      poolLabel = `'${info.material}' 자료 유형`;
    } else if(reason === "logic"){
      matches = Object.entries(QUESTION_MAP).filter(
        ([k, v]) => k !== key && v.points === 3
      );
      poolLabel = `배점 3점(복합 추론형)`;
    } else {
      const subsubMatches = info.subsub ? Object.entries(QUESTION_MAP).filter(
        ([k, v]) => k !== key && v.subsub === info.subsub
      ) : [];
      const subunitMatches = info.subunit ? Object.entries(QUESTION_MAP).filter(
        ([k, v]) => k !== key && v.subunit === info.subunit
      ) : [];
      if(subsubMatches.length >= MIN_POOL){
        matches = subsubMatches;
        poolLabel = `'${info.unit} > ${info.subunit} > ${info.subsub}' 소단원`;
      } else if(subunitMatches.length >= MIN_POOL){
        matches = subunitMatches;
        poolLabel = `'${info.unit} > ${info.subunit}' 중단원`;
      } else {
        matches = Object.entries(QUESTION_MAP).filter(
          ([k, v]) => k !== key && v.unit === info.unit
        );
        poolLabel = `'${info.unit}' 단원`;
      }
    }

    if(matches.length === 0){
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = `${poolLabel}에 등록된 다른 추천 문제가 아직 없습니다. 문항 매핑표에 데이터를 더 추가해 주세요.`;
      wrap.appendChild(note);
      return;
    }

    // 연관성(같은 난이도 우선) → 최근 연도 순으로 정렬 후 상위 N개만 노출
    const yearOf = (k) => parseInt(k.match(/^(\d{4})/)[1], 10);
    matches.sort((a, b) => {
      const [ka, va] = a, [kb, vb] = b;
      const relA = va.level === info.level ? 1 : 0;
      const relB = vb.level === info.level ? 1 : 0;
      if(relA !== relB) return relB - relA;
      return yearOf(kb) - yearOf(ka);
    });
    const totalCount = matches.length;
    matches = matches.slice(0, MAX_RECOMMEND);

    const info2 = document.createElement("div");
    info2.className = "empty-note";
    info2.style.marginBottom = "10px";
    info2.textContent = `${poolLabel} 전체 ${totalCount}문항 중, 난이도가 비슷하고 최근 연도인 문제 ${matches.length}개를 추천합니다.`;
    wrap.appendChild(info2);

    matches.forEach(([mkey, m]) => {
      const block = document.createElement("div");
      block.className = "rec-block";
      const answerId = `ans-${mkey}`;
      block.innerHTML = `
        <div class="title">${m.examLabel} ${mkey.split("__")[1]}번 <span class="sample-flag">SAMPLE</span></div>
        <div class="meta">지구과학Ⅰ &gt; ${m.unit} &gt; ${m.subunit} &gt; ${m.subsub} · ${m.material} · 난이도: ${m.level} · 배점: ${m.points}점</div>
        ${questionImageBlock(mkey, m)}
        <button class="answer-toggle" data-target="${answerId}">정답 보기</button>
        <div class="answer-box" id="${answerId}">
          ${m.answer != null ? `<div class="plain">정답 ${m.answer}</div>` : ""}
          ${answerLink(m)}
        </div>
      `;
      wrap.appendChild(block);
    });
  });

  // 잘라낸 이미지가 없는 경우, 원본 PDF 뷰어로 자동 대체
  wrap.querySelectorAll(".q-image-wrap img").forEach(img => {
    img.addEventListener("error", () => {
      const box = img.closest(".q-image-wrap");
      const fallback = box.dataset.fallback;
      if(fallback){
        box.outerHTML = `<div class="pdf-frame-wrap"><iframe src="${fallback}" title="문제"></iframe></div>`;
      } else {
        box.outerHTML = `<div class="pdf-frame-wrap"><div class="pdf-missing">문제 이미지를 불러올 수 없습니다</div></div>`;
      }
    }, { once: true });
  });

  wrap.querySelectorAll(".answer-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = document.getElementById(btn.dataset.target);
      box.classList.toggle("open");
      btn.textContent = box.classList.contains("open") ? "정답 숨기기" : "정답 보기";
    });
  });
}

$("#backTo3").addEventListener("click", () => goStep(2));
$("#restart").addEventListener("click", () => {
  state.exam = null;
  state.wrongQuestions = [];
  state.wrongReasons = {};
  goStep(1);
});

goStep(1);
</script>
</body>
</html>
