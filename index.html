<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오답문제 해결하여 수능 만점 받기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0F1720;
    --surface:#172231;
    --surface-2:#1F2E40;
    --text:#E8EDF2;
    --text-dim:#8FA3B8;
    --physics:#5EEAD4;
    --physics-dim:#1E3A38;
    --earth:#C97B4A;
    --earth-dim:#3A2A20;
    --line:#28374A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .readout{
    width:100%;
    height:2px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    margin:0;
  }
  header{
    width:100%;
    max-width:720px;
    padding:56px 24px 32px;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--physics);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-size:clamp(24px, 4vw, 34px);
    font-weight:700;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  p.sub{
    color:var(--text-dim);
    font-size:15px;
    line-height:1.6;
    margin:0;
  }
  main{
    width:100%;
    max-width:720px;
    padding:8px 24px 64px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:560px){
    main{grid-template-columns:1fr;}
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 22px;
    position:relative;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .18s ease, border-color .18s ease;
  }
  .card.active:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
  }
  .card.physics{ --accent:var(--physics); }
  .card.earth{ --accent:var(--earth); }
  .card .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .card .icon{
    width:38px; height:38px;
    border-radius:10px;
    background:var(--accent);
    opacity:.14;
    position:absolute;
    top:18px; right:18px;
  }
  .card h2{
    font-size:19px;
    margin:2px 0 2px;
  }
  .card p{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.55;
    margin:0;
  }
  .card .cta{
    margin-top:auto;
    padding-top:14px;
    font-size:13px;
    font-weight:600;
    color:var(--accent);
  }
  .card.disabled{
    opacity:.5;
    cursor:default;
  }
  .card.disabled .cta{color:var(--text-dim);}
  .wave{
    display:block;
    margin:6px auto 0;
    opacity:.7;
  }
  footer{
    color:var(--text-dim);
    font-size:12px;
    padding-bottom:40px;
    text-align:center;
    line-height:1.7;
  }
  footer b{color:var(--text);}
</style>
</head>
<body>
  <div class="readout"></div>
  <header>
    <div class="eyebrow">Wrong Answer Lab</div>
    <h1>오답문제 해결하여 수능 만점 받기</h1>
    <p class="sub">틀린 문제를 체크하면 같은 단원의 유사 유형을 추천해 드려요.<br>과목을 선택하고 시작하세요.</p>
  </header>
  <main>
    <a class="card physics active" href="physics.html">
      <span class="icon"></span>
      <span class="tag">Subject 01</span>
      <h2>물리학Ⅰ</h2>
      <p>모의고사·수능 회차를 선택하고 틀린 문항의 단원을 기록하면, 같은 단원의 다른 회차 문제를 추천해 드려요.</p>
      <span class="cta">시작하기 →</span>
    </a>
    <div class="card earth disabled">
      <span class="icon"></span>
      <span class="tag">Subject 02</span>
      <h2>지구과학Ⅰ</h2>
      <p>대기와 해양, 지구의 역사 등 단원별 오답 데이터를 준비 중입니다.</p>
      <span class="cta">준비 중</span>
    </div>
  </main>
  <footer>
    만든이 : <b>안준혁 엄마</b><br>
    오답 기록은 이 브라우저 세션에만 저장됩니다
  </footer>
</body>
</html>
